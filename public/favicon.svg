<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#e11d48" flood-opacity="0.7"/>
    </filter>
    
    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>

    <!-- Glass/Sheen Highlight -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Dark Rounded Backing for High Contrast on both Light & Dark Browser Tabs -->
  <rect width="64" height="64" rx="16" fill="#0b0b14" />
  <rect width="64" height="64" rx="16" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.4" />

  <!-- Main Romantic Glowing Heart -->
  <path
    d="M32 51 C30 49 13 35.5 13 23 C13 16 18.5 11 25.5 11 C29 11 31 13 32 14.5 C33 13 35 11 38.5 11 C45.5 11 51 16 51 23 C51 35.5 34 49 32 51 Z"
    fill="url(#heartGrad)"
    filter="url(#glow)"
  />

  <!-- Top-left Heart Sheen -->
  <path
    d="M25.5 13 C20 13 15.5 17.5 15.5 23 C15.5 28 22 36.5 32 45 C27.5 39 21.5 30.5 21.5 24.5 C21.5 19 24 15 25.5 13 Z"
    fill="url(#sheen)"
  />

  <!-- Sparkling Star Top-Right -->
  <path
    d="M48 9 L49.5 13.5 L54 15 L49.5 16.5 L48 21 L46.5 16.5 L42 15 L46.5 13.5 Z"
    fill="#ffd166"
  />
  <circle cx="48" cy="15" r="1.5" fill="#fff" />

  <!-- Little Sparkle Bottom-Left -->
  <circle cx="16" cy="39" r="1.5" fill="#fda4af" opacity="0.8" />
</svg>
